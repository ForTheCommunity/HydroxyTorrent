[package]
name = "hydroxy_tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
hydroxy_bencode = { path = "../hydroxy_bencode" }
hydroxy_utils = {path = "../hydroxy_utils"}

# third party dependencies
anyhow = "1.0.100"
sha1 = "0.10.6"
thiserror = "2.0.17"
ureq = "3.1.4"
urlencoding = "2.1.3"
reqwest = { version = "0.13" }
tokio = { version = "1.49.0", features = ["full"] }
rand = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
url = "2"
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "1"
