# ==============================================================================
# HydroxyTorrent Default Configuration
# ==============================================================================
# Default location on Linux: ~/.config/hydroxy_torrent/hydroxy_config.toml
# NOTE: Configuration keys may evolve across pre-1.0 releases.


# ------------------------------------------------------------------------------
# 1. Peer Wire & DHT Network Settings
# ------------------------------------------------------------------------------
[network_config]

# IP address for the incoming BitTorrent peer listener:
#   - "0.0.0.0" or "::" : Dual-stack wildcard — listens on ALL interfaces for
#                         both IPv4 and IPv6 incoming peer connections (recommended).
#   - Specific IP       : Bind to a single interface only (e.g. "192.168.1.10"
#                         for IPv4-only, or "2406:9cc0:..." for a single IPv6 interface).
listen_address = "0.0.0.0"

# TCP port for incoming BitTorrent peer connections (forward this port on your
# router if behind NAT for best seeding and swarm connectivity).
listen_port = 9999

# Enable or disable BEP 0005 Distributed Hash Table (trackerless peer discovery).
# Note: Automatically disabled per-torrent for private torrents (BEP 0027).
dht_enabled = true

# UDP port bound by the local DHT node.
dht_port = 9999

# Custom DHT bootstrap router endpoints ("host:port").
# Leave empty `[]` to use the built-in public bootstrap nodes:
#   - router.bittorrent.com:6881
#   - dht.transmissionbt.com:6881
#   - router.utorrent.com:6881
#   - dht.aelitis.com:6881
dht_bootstrap_routers = []


# ------------------------------------------------------------------------------
# 2. Storage Locations & Watch Directories
# ------------------------------------------------------------------------------
# You can define one or more `[[storage_config]]` blocks to organize torrents
# across multiple drives (e.g. NVMe SSD + secondary HDD).
#
# How Category Subfolders Work:
#   Place `.torrent` files inside a category subfolder under `watch_directory`.
#   The subfolder structure is mirrored automatically inside `download_directory`:
#
#     <watch_directory>/Ubuntu/ubuntu_24.iso.torrent  =>  <download_directory>/Ubuntu/ubuntu_24.iso
#     <watch_directory>/DebianOS/debian_12.iso.torrent =>  <download_directory>/DebianOS/debian_12.iso
#     <watch_directory>/Anime/S1/ep01.mkv.torrent     =>  <download_directory>/Anime/S1/ep01.mkv
#
#   IMPORTANT: `.torrent` files placed directly in the root of `watch_directory`
#   (without a category subfolder) are ignored.

[[storage_config]]
# Unique label for this storage target (shown in Remote Controller UI / TUI).
name = "default"

# Directory monitored for incoming `.torrent` files (organized in category subfolders).
watch_directory = "/home/user_1/temp/hydroxy/dottorrents"

# Final destination directory where completed downloads are stored.
download_directory = "/home/user_1/temp/hydroxy/downloads"

# Optional staging directory for incomplete downloads in progress.
# Once 100% downloaded and verified, files are moved to `download_directory`.
# If commented out or omitted, files download directly into `download_directory`.
# temp_directory = "/home/user_1/temp/hydroxy/incomplete"

# Mirror deletions from watch directory:
#   - `true`  : Deleting the `.torrent` file from `watch_directory` also deletes
#               the downloaded data.
#   - `false` : Deleting the `.torrent` file leaves downloaded files untouched (default).
reflection = false

# Maximum nested subfolder depth scanned inside `watch_directory` for categories (default: 3).
# Example: 1 = Category, 2 = Category/Subcategory, 3 = Category/Subcategory/Collection.
watch_directory_max_depth = 3

# Example second storage target on another drive:
# [[storage_config]]
# name = "secondary_hdd"
# watch_directory = "/mnt/hdd2/torrents/watch"
# download_directory = "/mnt/hdd2/torrents/downloads"
# temp_directory = "/mnt/hdd2/torrents/incomplete"
# reflection = false
# watch_directory_max_depth = 3


# ------------------------------------------------------------------------------
# 3. Remote Control Server (REST API & Web UI)
# ------------------------------------------------------------------------------
# Required for connecting via `hydroxy_rc` (Desktop, Mobile, Web) and `hydroxy_rc_tui`.
[remote_config]

# Enable or disable the HTTP RPC / REST control server (enabled by default).
rpc_enabled = true

# Serve the built-in static Web UI on the same address and port (`true` / `false`).
web_ui_enabled = false

# IP address for the RPC & Web UI HTTP server:
#   - "127.0.0.1" (or "::1") : Local machine only (most secure default).
#   - "0.0.0.0"   (or "::")  : Accessible from other devices on your LAN / network.
listen_address = "127.0.0.1"

# TCP port for the RPC API & Web UI server.
listen_port = 10000

# Authentication credentials:
#   - If left empty `""` on first start, HydroxyTorrent automatically sets
#     `username = "admin"`, generates a secure 16-character random password
#     (printed once to the daemon startup log), and stores its PBKDF2-SHA256 hash.
#   - To set or reset your own password, type a plain-text password here and
#     restart the daemon — it will be automatically hashed in-place on startup.
username = ""
password = ""


# ------------------------------------------------------------------------------
# 4. Transfer Queue, Bandwidth & Peer Limits
# ------------------------------------------------------------------------------
[limitations]

# Maximum number of concurrent active downloads (`0` = unlimited, default: 15).
max_active_downloads = 15

# Exclude stalled / very slow torrents from counting toward `max_active_downloads`
# so queued torrents can start automatically (qBittorrent-style queue rotation).
dont_count_slow_torrents = true

# Download speed threshold in KB/s below which an active torrent is treated as slow (default: 10).
slow_torrent_dl_rate_threshold_kbps = 10

# Seconds a torrent must stay below the slow threshold before yielding its active slot (default: 60).
slow_torrent_inactive_timer_secs = 60

# Maximum number of concurrent seeding / uploading torrents (`0` = unlimited, default: 5).
max_active_uploads = 5

# Global download bandwidth limit in KB/s (`0` = unlimited).
max_download_speed_kbps = 0

# Global upload bandwidth limit in KB/s (`0` = unlimited).
max_upload_speed_kbps = 0

# Maximum simultaneous peer connections per individual torrent swarm (default: 50).
max_peers_per_torrent = 50

# Maximum total peer connections across all active torrents combined (default: 300).
max_total_peers = 300
